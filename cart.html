<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Foot-er-path</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo">Foot-er-path</a>
      <nav class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="shop.html?category=Running">Running</a>
        <a href="shop.html?category=Sneakers">Sneakers</a>
        <a href="shop.html?new=1">New Arrivals</a>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-link">Cart <span class="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <div class="container section">
    <h1 class="page-title">Your Cart</h1>
    <div id="cart-content"></div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCart() {
      const items = getCart();
      const el = document.getElementById("cart-content");

      if (items.length === 0) {
        el.innerHTML = `
          <div class="empty">
            <p>Your cart is empty.</p>
            <a href="shop.html" class="btn btn-dark mt-6">Continue Shopping</a>
          </div>`;
        return;
      }

      const subtotal = getSubtotal();
      const delivery = subtotal >= 100 ? 0 : 8;
      const total = subtotal + delivery;

      el.innerHTML = `
        <div class="cart-layout">
          <div>
            ${items.map(i => {
              const price = i.discountPrice != null ? i.discountPrice : i.price;
              return `
                <div class="cart-item" style="margin-bottom:1rem">
                  <div class="cart-item-img">
                    <img src="${i.image}" alt="${i.name}" />
                  </div>
                  <div class="cart-item-info">
                    <div class="flex-between">
                      <div>
                        <a href="product.html?slug=${i.slug}" class="font-bold">${i.name}</a>
                        <p class="text-sm text-muted mt-1">${i.color} / Size ${i.size}</p>
                      </div>
                      <p class="font-bold">${formatPrice(price * i.quantity)}</p>
                    </div>
                    <div class="flex-between mt-4" style="margin-top:auto;padding-top:0.75rem">
                      <div class="qty-row" style="margin:0">
                        <button class="qty-btn" onclick="changeQty('${i.id}', ${i.quantity - 1})">−</button>
                        <span>${i.quantity}</span>
                        <button class="qty-btn" onclick="changeQty('${i.id}', ${i.quantity + 1})">+</button>
                      </div>
                      <button class="text-sm text-accent" style="background:none;border:none;cursor:pointer" onclick="removeItem('${i.id}')">Remove</button>
                    </div>
                  </div>
                </div>`;
            }).join("")}
            <button class="text-sm text-muted mt-2" style="background:none;border:none;cursor:pointer" onclick="clearAll()">Clear cart</button>
          </div>

          <div class="summary-box">
            <h2 style="font-weight:600;margin-bottom:1rem">Order Summary</h2>
            <div class="summary-row"><span class="text-muted">Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <div class="summary-row"><span class="text-muted">Delivery</span><span>${delivery === 0 ? "Free" : formatPrice(delivery)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
            <a href="checkout.html" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Proceed to Checkout</a>
            <a href="shop.html" class="text-sm text-muted" style="display:block;text-align:center;margin-top:0.75rem">Continue Shopping</a>
          </div>
        </div>`;
    }

    window.changeQty = function(id, qty) {
      updateQuantity(id, qty);
      renderCart();
    };
    window.removeItem = function(id) {
      removeFromCart(id);
      renderCart();
    };
    window.clearAll = function() {
      clearCart();
      renderCart();
    };

    renderCart();
  </script>
</body>
</html>
