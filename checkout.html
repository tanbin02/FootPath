<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Foot-er-path</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo">Foot-er-path</a>
      <div class="nav-actions">
        <a href="cart.html" class="cart-link">Cart <span class="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <div class="container section">
    <h1 class="page-title">Checkout</h1>
    <div id="checkout-content"></div>
  </div>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script>
    const items = getCart();

    if (items.length === 0) {
      document.getElementById("checkout-content").innerHTML = `
        <div class="empty">
          <p>Your cart is empty.</p>
          <a href="shop.html">Go to Shop</a>
        </div>`;
    } else {
      renderForm();
    }

    function renderForm() {
      const subtotal = getSubtotal();
      const delivery = subtotal >= 100 ? 0 : 8;
      const total = subtotal + delivery;

      document.getElementById("checkout-content").innerHTML = `
        <form id="order-form" class="cart-layout">
          <div>
            <div class="form-card">
              <h2>Delivery Information</h2>
              <div class="form-grid">
                <div class="full">
                  <label>Full Name *</label>
                  <input required name="customerName" />
                </div>
                <div>
                  <label>Phone *</label>
                  <input required name="phone" type="tel" />
                </div>
                <div>
                  <label>Email</label>
                  <input type="email" name="email" />
                </div>
                <div class="full">
                  <label>Address *</label>
                  <input required name="address" />
                </div>
                <div>
                  <label>Division</label>
                  <input name="division" />
                </div>
                <div>
                  <label>District</label>
                  <input name="district" />
                </div>
                <div>
                  <label>Area / Thana</label>
                  <input name="area" />
                </div>
                <div>
                  <label>Postal Code</label>
                  <input name="postalCode" />
                </div>
                <div class="full">
                  <label>Delivery Notes</label>
                  <textarea name="notes" rows="2"></textarea>
                </div>
              </div>
            </div>

            <div class="form-card">
              <h2>Payment Method</h2>
              <label class="radio-row">
                <input type="radio" name="paymentMethod" value="COD" checked /> Cash on Delivery
              </label>
              <label class="radio-row">
                <input type="radio" name="paymentMethod" value="bKash" /> bKash
              </label>
              <label class="radio-row">
                <input type="radio" name="paymentMethod" value="Nagad" /> Nagad
              </label>
              <label class="radio-row">
                <input type="radio" name="paymentMethod" value="Card" /> Card
              </label>
            </div>
          </div>

          <div class="summary-box">
            <h2 style="font-weight:600;margin-bottom:1rem">Order Summary</h2>
            ${items.map(i => {
              const price = i.discountPrice != null ? i.discountPrice : i.price;
              return `
                <div class="summary-row">
                  <span class="text-muted">
                    ${i.name} × ${i.quantity}<br>
                    <small>${i.color} / ${i.size}</small>
                  </span>
                  <span class="font-bold">${formatPrice(price * i.quantity)}</span>
                </div>`;
            }).join("")}

            <div class="summary-row mt-4">
              <span class="text-muted">Subtotal</span>
              <span>${formatPrice(subtotal)}</span>
            </div>
            <div class="summary-row">
              <span class="text-muted">Delivery</span>
              <span>${delivery === 0 ? "Free" : formatPrice(delivery)}</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span>${formatPrice(total)}</span>
            </div>

            <button type="submit" id="place-order-btn" class="btn btn-primary" style="width:100%;margin-top:1.5rem">
              Place Order
            </button>
          </div>
        </form>
      `;

      document.getElementById("order-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const btn = document.getElementById("place-order-btn");
        btn.disabled = true;
        btn.textContent = "Placing Order...";

        const fd = new FormData(this);

        const orderItems = items.map(i => ({
          productId: i.productId,
          productName: i.name,
          size: i.size,
          color: i.color,
          quantity: i.quantity,
          unitPrice: i.discountPrice != null ? i.discountPrice : i.price,
          totalPrice: (i.discountPrice != null ? i.discountPrice : i.price) * i.quantity
        }));

        try {
          const order = await saveOrder({
            customerName: fd.get("customerName"),
            phone: fd.get("phone"),
            email: fd.get("email") || "",
            address: fd.get("address"),
            division: fd.get("division") || "",
            district: fd.get("district") || "",
            area: fd.get("area") || "",
            postalCode: fd.get("postalCode") || "",
            notes: fd.get("notes") || "",
            items: orderItems,
            subtotal,
            discount: 0,
            deliveryCharge: delivery,
            total,
            paymentMethod: fd.get("paymentMethod"),
            paymentStatus: "PENDING",
            orderStatus: "PENDING"
          });

          clearCart();

          document.getElementById("checkout-content").innerHTML = `
            <div class="success-box">
              <div class="check">✓</div>
              <h1 class="page-title mt-4">Order Placed!</h1>
              <p class="mt-2">Your order number is <strong>${order.orderNumber}</strong></p>
              <p class="text-sm text-muted mt-2">We will contact you soon for confirmation.</p>
              <p class="text-sm text-muted mt-1">Order has been saved. Admin can see it & download as Excel/CSV.</p>
              <a href="shop.html" class="btn btn-dark mt-8">Continue Shopping</a>
            </div>`;
        } catch (err) {
          console.error(err);
          alert("Something went wrong while placing the order. Please try again.");
          btn.disabled = false;
          btn.textContent = "Place Order";
        }
      });
    }
  </script>
</body>
</html>
